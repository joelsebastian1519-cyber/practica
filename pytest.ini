[pytest]
testpaths = tests
pythonpath = src tests
addopts = -v --strict-markers
markers =
    unitaria: pruebas de componentes individuales
    integracion: servicio + base de datos
    sistema: pruebas de extremo a extremo sobre la API
    seguridad: pruebas no funcionales de seguridad
    regresion: pruebas que protegen defectos ya corregidos
